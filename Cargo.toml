[package]
name = "couch-denon"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Denon AVR main-zone control for Couch"
repository = "https://github.com/dangerouslaser/couch-integration-denon"

[dependencies]
# Protocol types and the device SDK stay owned by Couch. Pinning the same
# immutable Couch revision here prevents an independent integration release
# from silently changing its host contract.
couch-plugin = { git = "https://github.com/dangerouslaser/couch.git", rev = "f274804c5219db00446f1b9e5ce46391adcfd37c" }
couch-sdk = { git = "https://github.com/dangerouslaser/couch.git", rev = "f274804c5219db00446f1b9e5ce46391adcfd37c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
couch-plugin = { git = "https://github.com/dangerouslaser/couch.git", rev = "f274804c5219db00446f1b9e5ce46391adcfd37c", features = ["testing"] }
couch-sdk = { git = "https://github.com/dangerouslaser/couch.git", rev = "f274804c5219db00446f1b9e5ce46391adcfd37c", features = ["testing"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
