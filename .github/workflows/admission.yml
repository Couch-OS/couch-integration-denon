name: Integration admission

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: denon-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Require one immutable Couch SDK revision
        run: |
          python3 - <<'PY'
          import pathlib, re
          manifest = pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
          revisions = re.findall(r'couch-(?:plugin|sdk).*?rev = "([0-9a-f]{40})"', manifest)
          assert revisions and len(set(revisions)) == 1, "SDK dependencies must share one full Git revision"
          PY
      - run: cargo fmt -- --check
      - run: cargo test --locked --all-targets
